services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bhoosen123
      POSTGRES_DB: luckybeard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  luckybeard_api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_TEST=${DATABASE_URL_TEST}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=${PORT}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
